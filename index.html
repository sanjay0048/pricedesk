<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Desk</title>
<script>(function(){var p;try{p=localStorage.getItem("pd-theme")}catch(e){}p=p||"auto";var d=p==="dark"||(p==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";})();</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4E79">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* ---------- theme tokens ---------- */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --surface-2:#F6F8FA; --head:#E6ECF1; --head-2:#EEF2F6;
  --line:#D5DCE3; --line-2:#E8EDF1; --soft:#EBF0F4; --hover:#F8FAFC; --focus:#EAF3FC;
  --ink:#1B2A3A; --mute:#66768A; --faint:#A9B4BF;
  --accent:#1F4E79; --btn:#1F4E79; --btn-2:#173B5C; --on-btn:#FFFFFF;
  --top:#1F4E79; --top-ink:#C4D6E8; --top-chip:rgba(255,255,255,.1);
  --low-bg:#CDEFD5; --low-ink:#0B6B1F; --low-ink-2:#2F6B3A; --low-bar:#2E9E4F;
  --alloc-bg:#DCEAF8; --alloc-ink:#1F4E79; --alloc-bar:#4A8BD0;
  --amber:#9A5B00; --amber-bg:#FFF1D6; --amber-line:#F0D9A8; --red:#A61B1B; --red-bg:#FBE9E9;
  --cat-bg:#E3EDF7; --shadow:rgba(20,45,70,.16); --scrim:rgba(15,30,45,.45); --card-shadow:0 1px 2px rgba(20,45,70,.06);
  --navy:var(--accent);
  --ui:'Barlow','Segoe UI',system-ui,sans-serif; --cond:'Barlow Semi Condensed','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html[data-theme=dark]{
  --bg:#0E151C; --surface:#151F29; --surface-2:#18222D; --head:#1C2935; --head-2:#17212B;
  --line:#2A3947; --line-2:#202D3A; --soft:#1F2B37; --hover:#18232E; --focus:#1A2C3E;
  --ink:#E2E9F0; --mute:#8D9EAF; --faint:#5C6E80;
  --accent:#72B4F2; --btn:#2D6CA9; --btn-2:#3B7CBC; --on-btn:#FFFFFF;
  --top:#0A121A; --top-ink:#9DB2C6; --top-chip:rgba(255,255,255,.07);
  --low-bg:#163723; --low-ink:#7FE09A; --low-ink-2:#9ED8AE; --low-bar:#3FBF68;
  --alloc-bg:#16304A; --alloc-ink:#97C8F5; --alloc-bar:#5AA2E6;
  --amber:#F2B45C; --amber-bg:#30240E; --amber-line:#5A4318; --red:#FF8C8C; --red-bg:#3A1D1D;
  --cat-bg:#1C3249; --shadow:rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6); --card-shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--ui);font-size:14px;color:var(--ink);background:var(--bg);min-height:100vh}
button{font:600 14px var(--ui);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 13px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
button:hover{border-color:var(--faint)}
button.primary{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
button.primary:hover{background:var(--btn-2);border-color:var(--btn-2)}
button.ghost{background:transparent;border-color:transparent;color:var(--mute)}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
button.danger{color:var(--red)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.x{border:0;background:none;color:var(--faint);padding:4px 8px;font-size:16px;line-height:1}
.x:hover{color:var(--red)}
input,select,textarea{font:inherit;color:inherit;background:transparent}
a{color:var(--accent)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:0 18px;height:50px;background:var(--top);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.brand{font:700 19px var(--cond);letter-spacing:.2px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand i{display:inline-block;width:13px;height:13px;border-radius:3px;background:#C6EFCE;box-shadow:inset 0 0 0 2px #fff}
.tabs{display:flex;height:100%;overflow-x:auto}
.tabs button{background:none;border:0;border-radius:0;color:var(--top-ink);font:600 14.5px var(--cond);height:100%;padding:0 12px;border-bottom:3px solid transparent}
.tabs button:hover{color:#fff}
.tabs button.on{color:#fff;border-bottom-color:#7FD492}
.badge{display:inline-block;min-width:19px;padding:0 6px;border-radius:10px;background:#FFC24B;color:#3A2A00;font:700 12px var(--ui);line-height:18px;text-align:center;margin-left:3px}
.status{font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--top-chip);padding:5px 10px;border-radius:20px;white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:#7FD492}
.status.warn .dot{background:#FFC24B}
.status.err .dot{background:#FF7B7B}
.status.busy .dot{background:#9FC3E8}
.themebtn{margin-left:auto;background:var(--top-chip);border:0;color:#fff;border-radius:20px;padding:5px 10px;font:600 12.5px var(--ui);display:flex;align-items:center;gap:6px}
.themebtn:hover{background:rgba(255,255,255,.18)}
.themebtn svg{width:15px;height:15px}

.banner{background:var(--amber-bg);color:var(--amber);padding:9px 22px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--amber-line)}
.banner button{margin-left:auto}

main{padding:18px 22px 70px}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.bar h1{font:700 24px var(--cond);margin:0;line-height:1.1}
.bar p{margin:4px 0 0;color:var(--mute)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mute)}
.search{border:1px solid var(--line);border-radius:7px;padding:7px 11px;background:var(--surface);min-width:260px}
.tip{color:var(--mute);font-size:12.5px;margin:8px 2px 0}
.empty{padding:40px;text-align:center;color:var(--mute)}

/* ---------- grids ---------- */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 165px);box-shadow:var(--card-shadow)}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%}
.grid th{position:sticky;top:0;z-index:3;background:var(--head);font:600 13px var(--cond);letter-spacing:.15px;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line-2);white-space:nowrap;vertical-align:bottom;color:var(--ink)}
.grid td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);padding:0;vertical-align:top;background:var(--surface)}
.grid tr:hover td{background:var(--hover)}
.grid input{border:0;background:transparent;padding:6px 8px;width:100%;outline:none;min-width:0;color:var(--ink)}
.grid input:focus{background:var(--focus);box-shadow:inset 0 0 0 2px var(--accent);border-radius:2px}
.grid input::placeholder{color:var(--faint)}
.grid td.n{color:var(--faint);font-size:12px;text-align:right;padding:8px 8px 0;width:34px}
.grid td.ctrl{width:30px;text-align:center;vertical-align:middle}
.grid .num{text-align:right;font-variant-numeric:tabular-nums}
.grid td.txt{padding:6px 8px}
.sticky1{position:sticky;left:0;z-index:2}
.sticky2{position:sticky;left:160px;z-index:2;box-shadow:1px 0 0 var(--line)}
th.sticky1,th.sticky2{z-index:4}
.w-code{width:160px;min-width:160px;max-width:160px}
.w-desc{width:230px;min-width:230px}
.w-qty{width:58px;min-width:58px}
.hint{font-size:11.5px;color:var(--mute);padding:0 8px 6px;margin-top:-4px;line-height:1.3}

/* ---------- comparison ---------- */
th.sup{min-width:124px;width:124px;max-width:124px;padding:5px 6px 0 8px}
th.sup .nm{font-size:13px;line-height:1.2}
th.sup .nm > span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th.sup .dup{display:block;font-weight:500;color:var(--mute);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;min-height:14px}
th.sup .x,th.sup .pq{position:absolute;top:3px;opacity:0;background:var(--head);box-shadow:-4px 0 6px var(--head);transition:opacity .12s}
th.sup .pq{right:22px} th.sup .x{right:2px;font-size:14px;padding:2px 4px}
th.sup:hover .x,th.sup:hover .pq,th.sup .x:focus,th.sup .pq:focus{opacity:1}
.pq{border:0;background:none;color:var(--accent);padding:2px 3px;border-radius:4px;display:inline-flex}
.pq:hover{background:var(--surface)}
.pq svg{width:14px;height:14px}
th.sup input{border:1px solid transparent;border-radius:4px;background:var(--surface-2);font:400 11.5px var(--ui);padding:3px 6px;margin:3px 0 5px;width:100%;color:var(--ink)}
th.sup input::placeholder{color:var(--faint)}
th.sup input:focus{border-color:var(--accent);background:var(--surface);outline:none}
th.add{min-width:128px;width:128px;background:var(--head-2);padding:5px}
th.add input{border:1px dashed var(--faint);border-radius:5px;background:var(--surface);padding:6px 8px;width:100%;font:500 12.5px var(--ui);color:var(--ink)}
th.add input:focus{border-style:solid;border-color:var(--accent);outline:none}
td.addcol{background:var(--surface-2)}
td.cell{position:relative;width:124px;min-width:124px;max-width:124px}
td.cell .cw{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;width:100%;min-width:0;overflow:hidden}
td.cell .m,td.cell .p,td.cell .n{grid-column:1/-1}
td.cell .m{font-size:11.5px;color:var(--mute);text-align:right;padding:4px 8px 0;line-height:1.25}
td.cell .p{text-align:right;font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;padding:1px 8px 5px;line-height:1.25}
td.cell .p::placeholder{font-weight:400;font-size:13px}
td.cell .n{display:none;text-align:right;font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;color:var(--accent);padding:0 8px 5px}
td.cell.neg .n,td.cell.nopen .n{display:block}
td.cell.neg .p{text-decoration:line-through;font-weight:400;font-size:12px;color:var(--mute);padding-bottom:0}
td.cell .qw{grid-column:1;grid-row:4;display:none;align-items:center;gap:1px;min-width:0;padding:0 0 5px 7px;font-size:10.5px;color:var(--mute);white-space:nowrap}
td.cell.hasq .qw,td.cell.qopen .qw{display:flex}
td.cell .qw input{width:44px;flex:none;padding:1px 3px;text-align:left;font-size:11.5px;font-weight:700;color:var(--ink)}
td.cell .ord{grid-column:1/-1;grid-row:5;display:none;text-align:right;font-size:11px;font-weight:700;color:var(--alloc-ink);padding:0 8px 5px;white-space:nowrap}
td.cell.hasord .ord{display:block}
td.cell.hasord .qw{padding-bottom:1px}
td.cell.qlow .qw,td.cell.qlow .qw input{color:var(--amber)}
td.cell.hasord.qlow .qw,td.cell.hasord.qlow .qw input{color:var(--mute)}
td.cell.low,tr:hover td.cell.low{background:var(--low-bg);box-shadow:inset 3px 0 0 var(--low-bar)}
td.cell.low .p,td.cell.low.neg .n,td.cell.low .ord{color:var(--low-ink)}
td.cell.low .m{color:var(--low-ink-2)}
td.cell.low.neg .p{color:var(--low-ink-2)}
td.cell.alloc,tr:hover td.cell.alloc{background:var(--alloc-bg);box-shadow:inset 3px 0 0 var(--alloc-bar)}
td.cell.alloc .p,td.cell.alloc.neg .n{color:var(--alloc-ink)}
td.cell.negbad .n{color:var(--amber)}
.nb{position:absolute;left:3px;top:19px;display:none;border:0;background:var(--surface);color:var(--accent);font:600 10px var(--ui);padding:1px 4px;border-radius:4px;box-shadow:0 0 0 1px var(--line);z-index:1}
.nb.qb{top:3px}
td.cell.hasp:hover .nb,td.cell.hasp:focus-within .nb{display:block}
td.cell.neg .nb:not(.qb),td.cell.nopen .nb:not(.qb){display:none!important}
td.cell.hasq .qb,td.cell.qopen .qb{display:none!important}
th.best,td.best{border-left:2px solid var(--line)}
td.res{padding:6px 8px;white-space:nowrap;font-size:13px}
td.best{font-weight:700;color:var(--low-ink);text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
td.best:not(:empty),tr:hover td.best:not(:empty){background:var(--low-bg)}
td.best .sp2{background:var(--alloc-bg);color:var(--alloc-ink);padding:0 3px;border-radius:3px}
.splitlbl{font-size:10.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.refbar{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;vertical-align:middle}
.refsel{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:14px var(--ui);color:var(--ink);background:var(--surface)}
.refsel.unset{color:var(--mute)}
.prnw{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.prnw span{padding:3px 7px;background:var(--soft);color:var(--mute);font-size:12.5px;font-weight:600;align-self:stretch;display:flex;align-items:center}
.prnw input{border:0;padding:3px 8px;width:110px;font:14px var(--ui);outline:none;color:var(--ink)}
.prnw:focus-within{border-color:var(--accent)}
.refprev{color:var(--accent);font-weight:600}
input[type=date]{background:var(--surface);color:var(--ink)}

/* ---------- pending ---------- */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid #FFC24B;border-radius:10px;display:flex;flex-direction:column;box-shadow:var(--card-shadow)}
.pcard.live{border-left-color:var(--accent)}
.pcard header{padding:12px 14px 6px}
.pcard .meta{color:var(--mute);font-size:12.5px;margin-top:2px}
.pcard table{width:100%;border-collapse:collapse;font-size:13px}
.pcard td{padding:5px 14px;border-top:1px solid var(--soft);vertical-align:top}
.pcard td.pr{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pcard td.pr b{color:var(--low-ink)}
.pcard .wait{color:var(--amber);font-size:12px}
.pcard .sups{padding:8px 14px;display:flex;gap:5px;flex-wrap:wrap;border-top:1px solid var(--soft)}
.pcard footer{margin-top:auto;padding:10px 14px;border-top:1px solid var(--soft);display:flex;gap:8px;flex-wrap:wrap}
.pcard footer button{padding:5px 11px;font-size:13px}
.pcard footer .danger{margin-left:auto}
.pcard .refbar{margin-top:6px}
.pcard .refsel,.pcard .prnw input{font-size:13px}

/* ---------- paste quote ---------- */
.pqmap{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pqmap label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);flex:1 1 110px;min-width:0;max-width:170px}
.pqmap select{border:1px solid var(--line);border-radius:5px;padding:5px;font-size:13px;color:var(--ink);width:100%;background:var(--surface)}
.pqmap label small{color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pqprev{border:1px solid var(--line);border-radius:8px;max-height:34vh;overflow:auto}
.pqprev table{width:100%;border-collapse:collapse;font-size:13px}
.pqprev th{position:sticky;top:0;background:var(--head);text-align:left;padding:6px 8px;font:600 12.5px var(--cond)}
.pqprev td{padding:5px 8px;border-top:1px solid var(--soft)}
.pqprev td.num{text-align:right;font-variant-numeric:tabular-nums}
.pqprev tr.no td{color:var(--mute)}
.pqprev .st{font-size:12px;white-space:nowrap}
.pqprev .ok{color:var(--low-ink)} .pqprev .warn{color:var(--amber)}
textarea#pqt{width:100%;border:1px dashed var(--faint);border-radius:8px;padding:10px;font:13px var(--ui);resize:vertical;min-height:90px;color:var(--ink);background:var(--surface-2)}
textarea#pqt:focus{border-style:solid;border-color:var(--accent);outline:none}
.opts{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13px;margin:8px 0}
.opts label{display:flex;gap:6px;align-items:center}

/* ---------- history ---------- */
.group{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;box-shadow:var(--card-shadow)}
.group header{display:flex;align-items:center;gap:14px;padding:9px 14px;border-bottom:1px solid var(--soft);flex-wrap:wrap}
.group header h3{margin:0;font:700 17px var(--cond)}
.group header .actions{margin-left:auto}
.group header button{padding:5px 10px;font-size:13px}
.group .body{padding:12px 14px;overflow:auto}
.insight{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--low-bar);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;gap:28px;flex-wrap:wrap}
.insight div b{display:block;font:700 20px var(--cond);font-variant-numeric:tabular-nums}
.insight div span{color:var(--mute);font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;padding:7px 12px;color:var(--mute)}
.seg button.on{background:var(--soft);color:var(--ink)}
/* email-style tables shown inside the app follow the theme */
html[data-theme=dark] .eml td{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--line)!important}
html[data-theme=dark] .eml th{border-color:var(--line)!important}
html[data-theme=dark] .eml td[style*="C6EFCE"]{background:var(--low-bg)!important;color:var(--low-ink)!important}
html[data-theme=dark] .eml td[style*="DDEBF7"]{background:var(--alloc-bg)!important;color:var(--alloc-ink)!important}
html[data-theme=dark] .eml span{color:var(--mute)!important}
html[data-theme=dark] .eml span[style*="DDEBF7"]{background:var(--alloc-bg)!important;color:var(--alloc-ink)!important}
html[data-theme=dark] .eml span[style*="C55A11"]{color:var(--amber)!important}
html[data-theme=dark] .eml span[style*="006100"],html[data-theme=dark] .eml span[style*="2F6B3A"]{color:var(--low-ink)!important}
html[data-theme=dark] .eml span[style*="1F4E79"]{color:var(--alloc-ink)!important}

/* ---------- vendors ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:4px 11px;font:500 13px var(--ui);cursor:pointer}
.chip.on{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.chip small{opacity:.65;margin-left:3px}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;background:var(--soft);color:var(--mute)}
.tag.no{background:var(--red-bg);color:var(--red)}
a.tel{color:inherit;text-decoration:none}
a.wa{display:inline-flex;vertical-align:-3px;color:#25A244;padding:2px}
a.wa svg{width:16px;height:16px}
.tag.cat{background:var(--cat-bg);color:var(--accent);margin:1px 3px 1px 0}
.catpick{display:flex;gap:6px;flex-wrap:wrap}
.catpick .chip{font-size:13px}
.catpick .chip.on::before{content:'✓ '}
.catnew{display:flex;gap:6px;margin-top:8px}
.catnew input{flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:14px var(--ui);background:var(--surface);color:var(--ink)}

/* ---------- data page ---------- */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;max-width:1150px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:var(--card-shadow)}
.panel h2{font:700 18px var(--cond);margin:0 0 6px}
.panel p{margin:0 0 12px;color:var(--mute);line-height:1.45;max-width:62ch}
.panel .actions{margin-top:6px}
.panel ol{margin:0;padding-left:20px;line-height:1.6;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 12px}
.kv dt{color:var(--mute)} .kv dd{margin:0;font-weight:600}

/* ---------- autocomplete ---------- */
.ac{position:fixed;z-index:100;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px var(--shadow);max-height:320px;overflow:auto;padding:4px 0;min-width:260px;color:var(--ink)}
.ac div{padding:6px 11px;cursor:pointer}
.ac div.on{background:var(--focus)}
.ac b{font-weight:600}
.ac small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}

const cleanPrn = v => String(v || '').replace(/^\s*prn[\s:#.\-]*/i, '').trim();
/* "Cariva Auto Center - PRN 008758", or the branch alone, or "PRN 008758" alone; older free-text references are kept as they were */
function fmtRef(o) {
  const b = String((o && o.branch) || '').trim(), p = cleanPrn(o && o.prn);
  if (b || p) return [b, p ? 'PRN ' + p : ''].filter(Boolean).join(' - ');
  return String((o && o.ref) || '').trim();
}
function branchSelect(f, val, extra = '') {

    items: (d.items || []).map(i => ({ code: String(i.code ?? '').trim(), desc: i.desc || '', brand: i.brand || '' })).filter(i => i.code),
    history: (d.history || []).map(h => ({ id: h.id || uid(), date: h.date || today(), inq: +h.inq || 0, code: String(h.code ?? ''), desc: h.desc || '', supplier: h.supplier || '', model: h.model || '', price: num(h.price), qty: h.qty ?? '', final: isNaN(num(h.final)) ? null : num(h.final), avail: isNaN(num(h.avail)) ? null : num(h.avail), ref: h.ref || '', branch: h.branch || '', prn: h.prn || '' })).filter(h => !isNaN(h.price)),
    branches: Array.isArray(d.branches) && d.branches.length ? d.branches.map(String).filter(Boolean) : DEFAULT_BRANCHES.slice(),
    rfq: { branch: rfq.branch || '', prn: rfq.prn || '', rows: (rfq.rows || []).map(r => ({ id: r.id || uid(), brand: r.brand || '', type: r.type || '', code: String(r.code ?? ''), desc: r.desc || '', qty: r.qty ?? '' })), subject: rfq.subject || 'Request for Quotation', sentTo: rfq.sentTo || [],

async function importVendors() {

    'cat-del': () => { const c = S.categories[+b.dataset.i], n = S.vendors.filter(v => v.cats.includes(c)).length; if (!confirm(`Remove the category “${c}”?${n ? `\n\nIt will be removed from ${plural(n, 'vendor')}.` : ''}`)) return; S.categories.splice(+b.dataset.i, 1); S.vendors.forEach(v => { v.cats = v.cats.filter(x => x !== c); }); if (vspec === c) vspec = ''; touch(); renderView(); },
    'd-backup': backupNow, 'ph-send': sendToPC, 'ph-load': loadFromPC, 'pc-send-phone': sendToPhone, 'pc-load-phone': loadPhoneFile,
    'pc-away-clear': () => { if (!confirm('Clear the reminder? Only do this if you are not going to load a file from the phone.')) return; LS.set('pd-away', null); renderBanner(); if (tab === 'data') renderView(); }, 'd-restore': restoreBackup, 'd-xlsx': exportExcel,
    'd-open': openDataFile, 'd-create': () => createDataFile()
  };
  acts[a] && acts[a]();
});
document.addEventListener('change', e => { if (e.target.id === 'hbranch') { hbranch = e.target.value; renderView(); } });
document.addEventListener('change', e => { const i = e.target.dataset && e.target.dataset.br; if (i === undefined) return; const v = e.target.value.trim(); if (!v) { e.target.value = S.branches[+i]; return; } S.branches[+i] = v; touch(); toast('Branch renamed'); });
document.addEventListener('change', e => {
  const i = e.target.dataset && e.target.dataset.catI; if (i === undefined) return;
  const old = S.categories[+i], v = e.target.value.trim();
  if (!v || S.categories.some((c, j) => j !== +i && norm(c) === norm(v))) { e.target.value = old; return toast(v ? 'That category already exists.' : 'Category name can’t be empty.', true); }
  S.categories[+i] = v; S.vendors.forEach(x => { x.cats = x.cats.map(c => c === old ? v : c); }); touch(); renderView(); toast('Category renamed');
});
let searchT;
document.addEventListener('input', e => {
  const id = e.target.id; if (!['hq', 'vq', 'iq'].includes(id)) return;
  const val = e.target.value; if (id === 'hq') hq = val; else if (id === 'vq') vq = val; else iq = val;
  clearTimeout(searchT); searchT = setTimeout(() => { const pos = e.target.selectionStart; renderView(); const el = $('#' + id); el.focus(); el.setSelectionRange(pos, pos); }, 150);
});
window.addEventListener('beforeunload', e => { if (pending) { persist(); e.preventDefault(); e.returnValue = ''; } });
/* drop blank items when leaving the Items tab */
const _go = go; go = t => { if (tab === 'items') { const n = S.items.length; S.items = S.items.filter(i => String(i.code).trim()); if (S.items.length !== n) touch(); } _go(t); };

/* ---------- theme: auto (follows Windows) / light / dark ---------- */
const THEMES = ['auto', 'light', 'dark'];
const ICONS = { auto: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 0 0 12z" fill="currentColor"/></svg>', light: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/></svg>', dark: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M13.5 10.5A6 6 0 0 1 5.5 2.5a6 6 0 1 0 8 8z"/></svg>' };
const themePref = () => { try { return localStorage.getItem('pd-theme') || 'auto'; } catch (e) { return 'auto'; } };
function applyTheme() {
  const p = themePref(), dark = p === 'dark' || (p === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const b = $('#themeBtn'); b.innerHTML = ICONS[p] + `<span>${p === 'auto' ? 'Auto' : p === 'light' ? 'Light' : 'Dark'}</span>`;
  b.title = `Theme: ${p === 'auto' ? 'follows your Windows setting' : p} — click to change`;
}
$('#themeBtn').addEventListener('click', () => { const p = THEMES[(THEMES.indexOf(themePref()) + 1) % 3]; try { localStorage.setItem('pd-theme', p); } catch (e) {} applyTheme(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
applyTheme();
/* installable app when served from a web address (GitHub Pages); the local PC file skips this */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});

boot();
</script>
